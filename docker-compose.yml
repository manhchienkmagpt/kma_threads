services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threads}
      POSTGRES_USER: ${POSTGRES_USER:-threads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threads} -d ${POSTGRES_DB:-threads}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: .env
    environment:
      THREADS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-threads}:${POSTGRES_PASSWORD:-threads}@db:5432/${POSTGRES_DB:-threads}
      HF_HOME: /root/.cache/huggingface
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  huggingface_cache:
